<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1224"><title>StudentLink — Connect with classmates</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=studentlink-blue-cap-favicon-2"><link rel="manifest" href="./manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="StudentLink"><link rel="apple-touch-icon" href="assets/icon-192.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css?v=studentlink-mobile-fix-48"></head><body><div id="app" class="startup-skeleton" role="status" aria-live="polite" aria-label="Loading StudentLink">
  <style>
    .startup-skeleton{min-height:100vh;padding:16px;box-sizing:border-box;background:#f4f6fb;color:#172033;font-family:system-ui,-apple-system,sans-serif}
    .startup-skeleton .sk-top,.startup-skeleton .sk-line,.startup-skeleton .sk-card,.startup-skeleton .sk-circle{background:linear-gradient(100deg,#e2e7f0 20%,#f5f7fb 38%,#e2e7f0 56%);background-size:220% 100%;animation:studentlink-sk-shimmer 1.35s ease-in-out infinite}
    .startup-skeleton .sk-top{height:54px;border-radius:14px;margin:0 auto 18px;max-width:1100px}
    .startup-skeleton .sk-wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:190px minmax(0,1fr) 220px;gap:16px}
    .startup-skeleton .sk-card{height:160px;border-radius:16px;margin-bottom:14px}
    .startup-skeleton .sk-main .sk-card:first-child{height:95px}
    .startup-skeleton .sk-circle{width:38px;height:38px;border-radius:50%;display:inline-block;margin:8px}
    .startup-skeleton .sk-label{font-size:14px;text-align:center;color:#657087;padding:6px 0 14px}
    @keyframes studentlink-sk-shimmer{to{background-position-x:-220%}}
    @media(max-width:720px){.startup-skeleton{padding:12px}.startup-skeleton .sk-wrap{grid-template-columns:minmax(0,1fr)}.startup-skeleton .sk-side{display:none}.startup-skeleton .sk-card{height:135px}.startup-skeleton .sk-main .sk-card:first-child{height:80px}}
    @media(prefers-reduced-motion:reduce){.startup-skeleton .sk-top,.startup-skeleton .sk-line,.startup-skeleton .sk-card,.startup-skeleton .sk-circle{animation:none}}
  </style>
  <div class="sk-top"></div><div class="sk-label">Getting StudentLink ready…</div>
  <div class="sk-wrap"><div class="sk-side"><div class="sk-card"></div><div class="sk-card"></div></div><div class="sk-main"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div><div class="sk-side"><div class="sk-card"></div><div class="sk-card"></div></div></div>
</div><div class="modalbg" id="modalbg" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="modal"><button type="button" id="modalclose" aria-label="Close window" onclick="document.getElementById('modalbg').classList.remove('show')" style="position:absolute;top:10px;right:10px">✕</button><div id="modaltitle" style="font-size:18px;font-weight:600;margin-bottom:16px"></div><div id="modalcontent"></div></div></div><script>
(function(){
  window.studentLinkInstallPrompt=null;
  window.addEventListener('beforeinstallprompt',function(event){event.preventDefault();window.studentLinkInstallPrompt=event;var button=document.getElementById('install-app');if(button)button.hidden=false;});
  window.addEventListener('appinstalled',function(){window.studentLinkInstallPrompt=null;var button=document.getElementById('install-app');if(button)button.hidden=true;});
  var appSrc='assets/app.js?v=studentlink-mobile-fix-48';
  var sources=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  function loadApp(){
    var app=document.createElement('script');
    app.src=appSrc;
    app.onerror=function(){
      var root=document.getElementById('app');
      if(root)root.innerHTML='<section style="max-width:620px;margin:24px auto;padding:24px;text-align:left;font-family:system-ui,sans-serif"><h2>StudentLink could not load</h2><p>The app script could not be downloaded. Check your connection, then reload this page.</p><button type="button" onclick="window.location.reload()">Reload StudentLink</button></section>';
    };
    document.body.appendChild(app);
  }
  function loadLibrary(index){
    if(window.supabase&&typeof window.supabase.createClient==='function'){loadApp();return;}
    if(index>=sources.length){loadApp();return;}
    var script=document.createElement('script');
    script.src=sources[index];
    script.onload=function(){
      if(window.supabase&&typeof window.supabase.createClient==='function')loadApp();
      else loadLibrary(index+1);
    };
    script.onerror=function(){loadLibrary(index+1);};
    document.head.appendChild(script);
  }
  loadLibrary(0);
})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js?v=studentlink-mobile-fix-48").catch(function(error){console.warn("StudentLink offline support unavailable:",error)})})}</script></body></html>
