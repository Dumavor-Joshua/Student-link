<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07132d"><title>StudentLink — Play. Code. Learn.</title><style>:root{--bg:#07132d;--p:#0d1e40;--p2:#132951;--line:#284775;--txt:#f5f7ff;--muted:#aebfe1;--blue:#3478ff;--mint:#3ce0b1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.header{height:68px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--p);position:sticky;top:0;z-index:100}.header .search{flex:1;background:var(--p2);border:none;border-radius:8px;padding:8px 12px;color:var(--txt);font-size:13px}.header .search::placeholder{color:var(--muted)}.title{font-size:24px;font-weight:600}.tiny{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 280px;gap:0;height:calc(100vh - 68px);overflow:hidden}.leftside,.rightside{background:var(--p);border-right:1px solid var(--line);overflow-y:auto;padding:16px}.main{background:var(--bg);overflow-y:auto;padding:16px}.card{background:var(--p);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}.head{margin-bottom:24px}.field{margin-bottom:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}input,textarea,select{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--txt);font:inherit}.btn{background:var(--blue);color:var(--txt);border:none;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px}.btn:hover{background:#4a8fff}.btn-secondary{background:var(--p2);color:var(--txt)}.btn-secondary:hover{background:var(--line)}.navitem{width:100%;text-align:left;background:0;border:none;color:var(--txt);padding:12px;border-radius:6px;cursor:pointer;margin-bottom:8px;display:flex;gap:12px;align-items:center}.navitem span:first-child{font-size:18px}.navitem.active{background:var(--blue)}.post-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}.avatar{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--line);border-radius:50%;font-weight:600;font-size:12px}textarea{resize:none}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}.modalbg.show{display:flex}.modal{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:20px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}@media(max-width:980px){.layout{grid-template-columns:180px minmax(0,1fr)}.rightside{display:none}}@media(max-width:680px){.header{height:58px;padding:0 10px}.header .search{display:none}.layout{display:flex;flex-direction:column}.leftside{order:3;display:flex;gap:0;height:auto;padding:0;border-right:none;border-top:1px solid var(--line)}.navitem{flex:1;margin:0;border-radius:0;font-size:0;padding:12px 8px}.navitem span:first-child{font-size:18px}.navitem span:last-child{display:none}}.auth{display:flex;height:100vh;align-items:center;justify-content:center;padding:20px}.hero{text-align:center;width:100%;max-width:400px}.brandicon{font-size:48px;display:block;margin-bottom:12px}.brand{font-size:28px;font-weight:700;margin-bottom:12px}h1{font-size:28px;font-weight:600;margin:0 0 16px 0}h1 span{color:var(--mint)}.tab-buttons{display:flex;gap:8px;margin-bottom:20px}.tab-buttons button{flex:1;background:var(--p2);border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:6px;cursor:pointer;font-weight:600}.tab-buttons button.active{background:var(--blue);border-color:var(--blue)}</style></head><body><div id="app" style="padding:30px;text-align:center">Loading StudentLink…</div><div class="modalbg" id="modalbg" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="modal"><div id="modaltitle" style="font-size:18px;font-weight:600;margin-bottom:16px"></div><div id="modalcontent"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Configure these two values from your own Supabase project. Never use a service-role key here.
const SUPABASE_URL='https://fpdcetkvxdryogtvldax.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_HMzJqdTbufV4vvJ6QyWl5A_-0PPa0Rs';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');const db=configured&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const S={session:null,profile:null,view:'feed',friends:[],requests:[],convos:[],chat:null,channel:null,game:'',ttt:Array(9).fill(0)};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(s='S'){return esc(s.trim().split(/\s+/).slice(0,2).map(x=>x[0].toUpperCase()).join(''))}
function authHTML(tab='signup',message=''){return `<div class="auth"><section class="hero"><div class="brand"><span class="brandicon">🎮</span>StudentLink</div><h1>School friends.<br><span style="color:var(--mint)">Play & Learn</span></h1><div class="tab-buttons"><button data-tab="signup" class="active">Sign up</button><button data-tab="login">Log in</button></div><form id="authform">${tab==='signup'?`<div class="field"><label>Nickname</label><input id="nick" placeholder="Your name" required></div><div class="field"><label>School</label><input id="school" placeholder="Your school" required></div>`:''}<div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button type="submit" class="btn" style="width:100%;margin-top:16px">${tab==='signup'?'Sign up':'Log in'}</button></form>${message?`<p style="color:var(--mint);margin-top:12px;font-size:13px">${esc(message)}</p>`:''}</section></div>`}
function renderAuth(tab='signup', msg='') {
  $('#app').innerHTML = authHTML(tab, msg);
  $$('[data-tab]').forEach(b => b.onclick = () => renderAuth(b.dataset.tab));

  const authForm = document.getElementById('authform');
  if (authForm) authForm.noValidate = true;

  if (authForm) {
    authForm.onsubmit = async e => {
      e.preventDefault();

      const email = document.getElementById('email')?.value.trim() || '';
      const password = document.getElementById('password')?.value || '';
      const nickname = document.getElementById('nick')?.value.trim() || '';

      if (tab === 'signup') {
        if (!nickname || nickname.length < 3) {
          toast('Nickname needs at least 3 characters.');
          return;
        }
        if (!email) {
          toast('Please enter an email address.');
          return;
        }
      }

      if (tab === 'login') {
        if (!email) {
          toast('Please enter your email.');
          return;
        }
      }

      try {
        if (tab === 'signup') {
          const { data, error } = await db.auth.signUp({
            email,
            password,
            options: {
              data: {
                nickname,
                school: document.getElementById('school')?.value.trim() || ''
              }
            }
          });
          if (error) throw error;
          renderAuth('login', 'Check your email for a confirmation link.');
          return;
        }

        if (tab === 'login') {
          const { data, error } = await db.auth.signInWithPassword({ email, password });
          if (error) throw error;
          await boot();
          return;
        }
      } catch (err) {
        console.error(err);
        renderAuth(tab, err.message || 'Could not complete that action.');
      }
    };
  }
}
function nav(v,ico,label){return `<button class="navitem ${S.view===v?'active':''}" data-view="${v}"><span>${ico}</span><span>${label}</span></button>`}function shell(){return `<header class="header"><div style="display:flex;gap:16px;flex:1;align-items:center"><span style="font-weight:600;font-size:16px">StudentLink</span><input type="text" class="search" id="search" placeholder="Search…"></div><button class="btn btn-secondary" id="logout">Log out</button></header><div class="layout"><div class="leftside">${nav('feed','📰','Feed')}${nav('friends','👥','Friends')}${nav('messages','💬','Messages')}${nav('games','🎮','Games')}${nav('profile','⚙️','Profile')}</div><div class="main" id="main"></div><div class="rightside"><h3 style="margin:0 0 16px 0">Trending schools</h3><div id="trending"></div></div></div>`}
async function boot(){if(!db){renderAuth('signup','Setup needed: create a Supabase project, run supabase_schema.sql, and replace the two configuration placeholders in index.html.');return}let {data:{session},error}=await db.auth.getSession();if(error||!session){renderAuth();return}S.session=session;await loadProfile();$('#app').innerHTML=shell();setUpRealtime();renderView();wireActions();$('#logout').onclick=()=>{db.auth.signOut();renderAuth()};const search=$('#search');if(search){search.onkeyup=async e=>{if(!e.target.value.trim())return;let {data}=await db.from('profiles').select('id,nickname').textSearch('nickname',e.target.value).limit(10);if(data)$$('#search-results')}}}async function setUpRealtime(){if(!db||!S.session)return;if(S.channel){await S.channel.unsubscribe()}S.channel=db.channel('feed-updates');S.channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},(payload)=>{console.log('New post:',payload);renderView()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'post_likes'},(payload)=>{renderView()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'friend_requests'},(payload)=>{renderView()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},(payload)=>{renderView()}).subscribe()}
async function loadProfile(){let {data,error}=await db.from('profiles').select('*').eq('id',S.session.user.id).maybeSingle();if(error)console.warn(error);S.profile=data||{id:S.session.user.id,nickname:'Student',school:''}}
async function renderView(){let m=$('#main');if(!m)return;m.innerHTML='<div class="card">Loading…</div>';try{if(S.view==='feed')await viewFeed();if(S.view==='friends')await viewFriends();if(S.view==='messages')await viewMessages();if(S.view==='games')viewGames();if(S.view==='profile')viewProfile();await viewSchools()}catch(e){console.error(e);m.innerHTML=`<div class="card"><b>Error</b><p>${esc(e.message)}</p></div>`}}
async function viewFeed(){let {data,error}=await db.from('posts').select('id,user_id,body,created_at,post_type,poll_question,poll_options').order('created_at',{ascending:false}).limit(40);if(error)throw error;let html=`<div class="head"><h1 class="title">Feed</h1><button class="btn" id="new-post">New post</button></div>`;if(data){let users=await Promise.all(data.map(p=>db.from('profiles').select('*').eq('id',p.user_id).single()));let likes=await db.from('post_likes').select('post_id').in('post_id',data.map(p=>p.id));let likeMap={};likes.data?.forEach(l=>likeMap[l.post_id]=(likeMap[l.post_id]||0)+1);let liked=await db.from('post_likes').select('post_id').in('post_id',data.map(p=>p.id)).eq('user_id',S.session.user.id);let likedSet=new Set(liked.data?.map(l=>l.post_id));html+=data.map((p,i)=>postCard(p,users[i].data,likedSet.has(p.id),likeMap[p.id]||0,0)).join('')}$('#main').innerHTML=html;document.getElementById('new-post')?.addEventListener('click',()=>{modal('Create a post','<form id="postform"><div class="field"><label>What\'s on your mind?</label><textarea id="pb" maxlength="280" required></textarea></div><div class="field"><label><input type="radio" name="pt" value="text" checked> Text</label><label><input type="radio" name="pt" value="poll"> Poll</label></div><div id="pollopts" style="display:none"><div class="field"><label>Question</label><input id="pq" maxlength="180"></div>'+[1,2,3,4].map(n=>`<div class="field"><label>Option ${n}</label><input id="po${n}" maxlength="100"></div>`).join('')+'</div><button type="submit" class="btn">Post</button></form>');document.querySelector('[value="poll"]').onchange=()=>$('#pollopts').style.display='block';document.querySelector('[value="text"]').onchange=()=>$('#pollopts').style.display='none';document.getElementById('postform').onsubmit=async e=>{e.preventDefault();let pt=document.querySelector('[name="pt"]:checked').value;if(pt==='poll'){let q=$('#pq').value.trim();let opts=[1,2,3,4].map(n=>$(`#po${n}`).value.trim()).filter(o=>o);if(!q||opts.length<2){toast('Need a question and at least 2 options');return}await db.from('posts').insert({user_id:S.session.user.id,post_type:'poll',poll_question:q,poll_options:opts})}else{let b=$('#pb').value.trim();if(!b){toast('Post cannot be empty');return}await db.from('posts').insert({user_id:S.session.user.id,body:b,post_type:'text'})}closeModal();renderView()}});$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like,b.classList.contains('liked')))}
function postCard(p,profile,liked,count,comments){return `<article class="card"><div class="post-top"><span class="avatar">${initials(profile?.nickname)}</span><div style="flex:1"><b>${esc(profile?.nickname)}</b> <span class="tiny">${new Date(p.created_at).toLocaleDateString()}</span></div></div>${p.post_type==='poll'?`<div><b>${esc(p.poll_question)}</b><div style="margin-top:8px">${(p.poll_options||[]).map(o=>`<div class="btn btn-secondary" style="margin-bottom:4px;text-align:left;width:100%;cursor:default">${esc(o)}</div>`).join('')}</div></div>`:`<p>${esc(p.body)}</p>`}<div style="display:flex;gap:12px;margin-top:12px"><button data-like="${p.id}" class="btn btn-secondary ${liked?'liked':''}" style="flex:1">❤️ ${count}</button></div></article>`}
async function toggleLike(id,liked){let q=liked?db.from('post_likes').delete().eq('post_id',id).eq('user_id',S.session.user.id):db.from('post_likes').insert({post_id:id,user_id:S.session.user.id});let {error}=await q;if(error)console.error(error);renderView()}
async function viewFriends(){let {data,error}=await db.from('profiles').select('id,nickname,school').neq('id',S.session.user.id).order('nickname').limit(100);if(error)throw error;let {data:sent}=await db.from('friend_requests').select('to_id').eq('from_id',S.session.user.id);let {data:recv}=await db.from('friend_requests').select('from_id').eq('to_id',S.session.user.id);let sentSet=new Set(sent?.map(r=>r.to_id));let recvSet=new Set(recv?.map(r=>r.from_id));let {data:friends}=await db.from('friendships').select('friend_id').eq('user_id',S.session.user.id);S.friends=friends||[];let friendSet=new Set(friends?.map(f=>f.friend_id));let html=`<div class="head"><h1 class="title">Friends</h1><span class="tiny">${friendSet.size} friends</span></div>`;html+=data?.map(p=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(p.nickname)}</b><div class="tiny">${esc(p.school||'No school')}</div></div><div style="display:flex;gap:8px">${friendSet.has(p.id)?`<button class="btn btn-secondary" data-messagefriend="${p.id}">Message</button>`:recvSet.has(p.id)?`<button class="btn" data-accept="${p.id}">Accept</button><button class="btn btn-secondary" data-decline="${p.id}">Decline</button>`:sentSet.has(p.id)?`<button class="btn btn-secondary" disabled>Requested</button>`:`<button class="btn" data-add="${p.id}">Add friend</button>`}</div></div></div>`).join('');$('#main').innerHTML=html;wireActions()}
async function startConversation(friendId){if(!S.friends.some(f=>f.id===friendId))return toast('Add this student as a friend first.');const me=S.session.user.id;const [user_a,user_b]=[me,friendId].sort();let {data,error}=await db.from('conversations').select('id').eq('user_a',user_a).eq('user_b',user_b).maybeSingle();if(error)throw error;if(!data){let {data:newConvo,error:createErr}=await db.from('conversations').insert({user_a,user_b}).select();if(createErr)throw createErr;data=newConvo[0]}S.chat=data.id;await viewMessages()}
async function viewMessages(){await loadConvos();$('#main').innerHTML=`<div class="head"><div><h1 class="title">Private messages</h1><span class="tiny">Messaging is limited to accepted friends.</span></div></div><div id="convos"></div>`;let convosHtml=S.convos.map(c=>`<div class="card" data-convo="${c.id}" style="cursor:pointer"><b>${esc(c.otherNickname)}</b><div class="tiny">${esc(c.lastMessage||'No messages')}</div></div>`).join('');$('#convos').innerHTML=convosHtml;$$('[data-convo]').forEach(el=>{el.onclick=async()=>{S.chat=el.dataset.convo;let {data,error}=await db.from('messages').select('*').eq('convo_id',S.chat).order('created_at');if(error)throw error;let messagesHtml=`<div class="head"><button id="back" class="btn btn-secondary">← Back</button></div><div style="flex:1;overflow-y:auto">${(data||[]).map(m=>`<div class="card" style="background:${m.sender_id===S.session.user.id?'var(--blue)':'var(--p2)'}"><b>${esc(m.nickname)}</b><p>${esc(m.body)}</p></div>`).join('')}</div><form id="msgform" style="padding:16px"><input id="msgtext" placeholder="Type a message…" style="margin-bottom:8px"><button type="submit" class="btn">Send</button></form>`;$('#main').innerHTML=messagesHtml;document.getElementById('back').onclick=()=>viewMessages();document.getElementById('msgform').onsubmit=async e=>{e.preventDefault();let text=$('#msgtext').value.trim();if(!text)return;await db.from('messages').insert({convo_id:S.chat,sender_id:S.session.user.id,body:text,nickname:S.profile.nickname});$('#msgtext').value='';renderView()}}})}
async function loadConvos(){let {data,error}=await db.from('conversations').select('*').or(`user_a.eq.${S.session.user.id},user_b.eq.${S.session.user.id}`);if(error)throw error;S.convos=(data||[]).map(c=>{let otherId=c.user_a===S.session.user.id?c.user_b:c.user_a;return{id:c.id,otherNickname:c.other_nickname||'Student',lastMessage:c.last_message||''}})}
function viewGames(){let gs=[['⭕❌','Tic-Tac-Toe','Two players on one device','ttt'],['🧠','Student Quiz','General knowledge','quiz'],['🔵🟡','Connect Four','Connect four in a row','connect']];$('#main').innerHTML=`<div class="head"><h1 class="title">Games</h1></div>${gs.map(g=>`<div class="card" data-game="${g[3]}" style="cursor:pointer"><span style="font-size:24px">${g[0]}</span> <b>${g[1]}</b><div class="tiny">${g[2]}</div></div>`).join('')}`;$$('[data-game]').forEach(el=>{el.onclick=()=>{S.game=el.dataset.game;S.view='game';renderView()}})}
function viewProfile(){let p=S.profile;$('#main').innerHTML=`<div class="head"><h1 class="title">My profile</h1><span class="tiny">Manage your nickname and school</span></div></div><div class="card"><form id="pf"><div class="field"><label>Nickname</label><input id="pn" value="${esc(p.nickname)}" required></div><div class="field"><label>School</label><input id="ps" value="${esc(p.school||'')}"></div><button type="submit" class="btn">Save</button></form></div>`;document.getElementById('pf').onsubmit=async e=>{e.preventDefault();let {error}=await db.from('profiles').update({nickname:$('#pn').value.trim(),school:$('#ps').value.trim()}).eq('id',S.session.user.id);if(error){console.error(error);toast('Could not update profile')}else{await loadProfile();renderView()}}}
async function viewSchools(){let {data,error}=await db.from('profiles').select('school').not('school','is',null).neq('school','').limit(500);if(error)throw error;let c={};(data||[]).forEach(p=>{let s=p.school.trim();c[s]=(c[s]||0)+1});let top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);$('#trending').innerHTML=top.map(([s,n])=>`<div class="card"><b>${esc(s)}</b><span class="tiny">${n} students</span></div>`).join('')}
async function addFriend(id){await db.from('friend_requests').insert({from_id:S.session.user.id,to_id:id});renderView()}async function acceptFriend(id){const me=S.session.user.id;const [user_a,user_b]=[me,id].sort();await db.from('friendships').insert({user_id:user_a,friend_id:user_b});await db.from('friendships').insert({user_id:user_b,friend_id:user_a});await db.from('friend_requests').delete().or(`and(from_id.eq.${id},to_id.eq.${me}),and(from_id.eq.${me},to_id.eq.${id})`);renderView()}async function declineFriend(id){await db.from('friend_requests').delete().or(`and(from_id.eq.${id},to_id.eq.${me}),and(from_id.eq.${me},to_id.eq.${id})`);renderView()}
function setView(v){S.view=v;renderView()}
function modal(title,content){$('#modaltitle').textContent=title;$('#modalcontent').innerHTML=content;$('#modalbg').classList.add('show')}
function closeModal(){$('#modalbg').classList.remove('show')}
function toast(msg){console.log(msg)}
function wireActions(){$$('[data-messagefriend]').forEach(b=>b.onclick=()=>startConversation(b.dataset.messagefriend));$$('[data-add]').forEach(b=>b.onclick=()=>addFriend(b.dataset.add));$$('[data-accept]').forEach(b=>b.onclick=()=>acceptFriend(b.dataset.accept));$$('[data-decline]').forEach(b=>b.onclick=()=>declineFriend(b.dataset.decline))}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){e.preventDefault();setView(v.dataset.view);return}let mf=e.target.closest('[data-messagefriend]');if(mf){startConversation(mf.dataset.messagefriend);return}});
(async()=>{if(!configured){renderAuth('signup','Setup needed: create Supabase project, run supabase_schema.sql, and replace the two placeholders in index.html.');return}await boot()})();
</script></body></html>
