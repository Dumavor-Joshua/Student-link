<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07132d"><title>StudentLink — Play. Code. Learn.</title><style>:root{--bg:#07132d;--p:#0d1e40;--p2:#132951;--line:#284775;--txt:#f5f7ff;--muted:#aebfe1;--blue:#3478ff;--mint:#3ce0b1;--red:#ff4757}.notification-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;background:var(--red);color:white;border-radius:50%;font-size:11px;font-weight:700;margin-left:4px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.header{height:68px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--p);position:sticky;top:0;z-index:100}.header .search{flex:1;background:var(--p2);border:none;border-radius:8px;padding:8px 12px;color:var(--txt);font-size:13px}.header .search::placeholder{color:var(--muted)}.title{font-size:24px;font-weight:600}.tiny{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:0;height:calc(100vh - 68px);overflow:hidden}.leftside,.rightside{background:var(--p);border-right:1px solid var(--line);overflow-y:auto;padding:16px}.main{background:var(--bg);overflow-y:auto;padding:16px}.card{background:var(--p);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}.head{margin-bottom:24px}.field{margin-bottom:12px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}input,textarea,select{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--txt);font:inherit}.btn{background:var(--blue);color:var(--txt);border:none;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px;transition:all 0.2s}.btn:hover{background:#4a8fff;transform: :none;min-height:80px}.composer-options{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.notification-item{background:var(--p2);border-left:3px solid var(--blue);padding:12px;margin-bottom:8px;border-radius:4px;cursor:pointer;transition:all 0.2s}.notification-item:hover{background:var(--line)}.notification-item.read{opacity:0.6}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(2px)}.modalbg.show{display:flex}.modal{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:20px;width:90%;max-width:600px;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.3)}.toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}.toast{background:var(--p);border:1px solid var(--line);border-left:3px solid var(--mint);padding:12px 16px;border-radius:6px;animation:slideIn 0.3s ease-out}@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}.message{display:flex;gap:8px;margin-bottom:12px;padding:8px;border-radius:6px}.message.sent{justify-content:flex-end}.message.sent .bubble{background:var(--blue);border-radius:12px 0 12px 12px}.message.received .bubble{background:var(--p2);border-radius:0 12px 12px 12px}.bubble{max-width:70%;padding:8px 12px;word-wrap:break-word}.message-time{font-size:11px;color:var(--muted);align-self:flex-end;margin:0 8px}.search-results{position:absolute;top:68px;left:20px;right:20px;background:var(--p);border:1px solid var(--line);border-radius:8px;max-height:300px;overflow-y:auto;z-index:50}.result-item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:all 0.2s}.result-item:hover{background:var(--p2)}.result-item:last-child{border-bottom:none}@media(max-width:1200px){.layout{grid-template-columns:180px minmax(0,1fr)}.rightside{display:none}}@media(max-width:680px){.header{height:58px;padding:0 10px}.header .search{display:none}.layout{display:flex;flex-direction:column}.leftside{order:3;display:flex;gap:0;height:auto;padding:0;border-right:none;border-top:1px solid var(--line)}.navitem{flex:1;margin:0;border-radius:0;font-size:0;padding:12px 8px;justify-content:center}.navitem span:first-child{font-size:18px}.navitem span:last-child{display:none}.composer{margin-left:-16px;margin-right:-16px;border-radius:0}}.auth{display:flex;height:100vh;align-items:center;justify-content:center;padding:20px}.hero{text-align:center;width:100%;max-width:400px}.brandicon{font-size:48px;display:block;margin-bottom:12px}.brand{font-size:28px;font-weight:700;margin-bottom:12px}h1{font-size:28px;font-weight:600;margin:0 0 16px 0}h1 span{color:var(--mint)}.tab-buttons{display:flex;gap:8px;margin-bottom:20px}.tab-buttons button{flex:1;background:var(--p2);border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:6px;cursor:pointer;font-weight:600;transition:all 0.2s}.tab-buttons button.active{background:var(--blue);border-color:var(--blue)}.tab-buttons button:hover{background:var(--line)}</style></head><body><div id="app" style="padding:30px;text-align:center">Loading StudentLink…</div><div class="modalbg" id="modalbg" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="modal"><div id="modaltitle" style="font-size:18px;font-weight:600;margin-bottom:16px"></div><div id="modalcontent"></div></div></div><div class="toast-container" id="toastContainer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://fpdcetkvxdryogtvldax.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_HMzJqdTbufV4vvJ6QyWl5A_-0PPa0Rs';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');const db=configured&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;

function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(s='S'){return esc(s.trim().split(/\s+/).slice(0,2).map(x=>x[0].toUpperCase()).join(''))}
function toast(msg,type='info'){const container=$('#toastContainer');const el=document.createElement('div');el.className='toast';el.textContent=msg;container.appendChild(el);setTimeout(()=>el.remove(),3000)}
function authHTML(tab='signup',message=''){return `<div class="auth"><section class="hero"><div class="brand"><span class="brandicon">🎮</span>StudentLink</div><h1>School friends.<br><span style="color:var(--mint)">Play & Learn</span></h1><div class="tab-buttons"><button data-tab="signup" class="${tab==='signup'?'active':''}">Sign up</button><button data-tab="login" class="${tab==='login'?'active':''}">Log in</button></div><form id="authform">${tab==='signup'?`<div class="field"><label>Nickname</label><input id="nick" placeholder="Your name" required></div><div class="field"><label>School</label><input id="school" placeholder="Your school" required></div>`:''}<div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button type="submit" class="btn" style="width:100%;margin-top:16px">${tab==='signup'?'Sign up':'Log in'}</button></form>${message?`<p style="color:var(--mint);margin-top:12px;font-size:13px">${esc(message)}</p>`:''}</section></div>`}
function renderAuth(tab='signup',msg=''){$('#app').innerHTML=authHTML(tab,msg);$$('[data-tab]').forEach(b=>b.onclick=()=>renderAuth(b.dataset.tab));const authForm=document.getElementById('authform');if(authForm)authForm.noValidate=true;if(authForm){authForm.onsubmit=async e=>{e.preventDefault();const email=document.getElementById('email')?.value.trim()||'';const password=document.getElementById('password')?.value||'';const nickname=document.getElementById('nick')?.value.trim()||'';if(tab==='signup'){if(!nickname||nickname.length<3){toast('Nickname needs at least 3 characters.');return}if(!email){toast('Please enter an email address.');return}}if(tab==='login'){if(!email){toast('Please enter your email.');return}}try{if(tab==='signup'){const {data,error}=await db.auth.signUp({email,password,options:{data:{nickname,school:document.getElementById('school')?.value.trim()||''}}});if(error)throw error;renderAuth('login','Check your email for a confirmation link.');return}if(tab==='login'){const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await boot();return}}catch(err){console.error(err);renderAuth(tab,err.message||'Could not complete that action.')}}}}
function shell(){const notifBadge=S.unreadCount>0?`<span class="notification-badge">${Math.min(S.unreadCount,9)}${S.unreadCount>9?'+':''}</span>`:'';return `<header class="header"><div style="display:flex;gap:16px;flex:1;align-items:center"><span style="font-weight:600;font-size:16px">📱StudentLink</span><input type="text" class="search" id="search" placeholder="Search posts, students..."></div><button class="btn btn-secondary btn-sm" id="notifications" title="Notifications">🔔${notifBadge}</button><button class="btn btn-secondary btn-sm" id="logout">Log out</button></header><div class="layout"><div class="leftside">${navItem('feed','📰','Feed')}${navItem('friends','👥','Friends')}${navItem('messages','💬','Messages')}${navItem('notifications','🔔','Alerts')}${navItem('games','🎮','Games')}${navItem('profile','⚙️','Profile')}</div><div class="main" id="main"></div><div class="rightside"><h3 style="margin:0 0 16px 0;display:flex;justify-content:space-between;align-items:center"><span>Online Students</span><span class="tiny" id="online-count">0</span></h3><div id="online-students"></div></div></div>`}
function navItem(v,ico,label){return `<button class="navitem ${S.view===v?'active':''}" data-view="${v}"><span>${ico}</span><span>${label}</span></button>`}
async function boot(){if(!db){renderAuth('signup','Setup needed: create a Supabase project, run supabase_schema.sql, and replace the two configuration placeholders in index.html.');return}let {data:{session},error}=await db.auth.getSession();if(error||!session){renderAuth();return}S.session=session;await loadProfile();await loadFriends();$('#app').innerHTML=shell();setUpRealtime();renderView();setupSearch();setupNotifications();$('#logout').onclick=()=>{db.auth.signOut();S.session=null;renderAuth()};$('#notifications').onclick=()=>{S.view='notifications';renderView()}}
async function loadProfile(){let {data,error}=await db.from('profiles').select('*').eq('id',S.session.user.id).maybeSingle();if(error)console.warn(error);S.profile=data||{id:S.session.user.id,nickname:'Student',school:''}}
async function loadFriends(){let {data}=await db.from('friendships').select('friend_id').eq('user_id',S.session.user.id);S.friendIds=new Set(data?.map(f=>f.friend_id)||[]);S.friends=data||[]}
async function setUpRealtime(){if(!db||!S.session)return;if(S.channel)await S.channel.unsubscribe();S.channel=db.channel('feed-updates');S.channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},(payload)=>{console.log('New post:',payload);if(S.view==='feed')renderView()}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},(payload)=>{S.unreadCount++;updateNotificationBadge();if(S.view==='messages')renderView()}).subscribe()}
function setupSearch(){const search=$('#search');if(!search)return;search.addEventListener('keyup',async(e)=>{const q=e.target.value.trim();if(!q){$$('.search-results').forEach(r=>r.remove());return}const {data}=await Promise.all([db.from('profiles').select('id,nickname,school').ilike('nickname',`%${q}%`).limit(5),db.from('posts').select('id,body,user_id').ilike('body',`%${q}%`).limit(5)]);if(!data)return})}
function setupNotifications(){setInterval(async()=>{if(!S.session)return;let {data}=await db.from('friend_requests').select('*').eq('to_id',S.session.user.id);S.unreadCount=(data||[]).length;updateNotificationBadge()},5000)}
function updateNotificationBadge(){const header=$('.header');if(!header)return;const notifBadge=S.unreadCount>0?`<span class="notification-badge">${Math.min(S.unreadCount,9)}${S.unreadCount>9?'+':''}</span>`:'';$$('.notification-badge').forEach(el=>el.remove());if(S.unreadCount>0){const btn=$('#notifications');if(btn){const badge=document.createElement('span');badge.className='notification-badge';badge.textContent=Math.min(S.unreadCount,9);btn.appendChild(badge)}}}
async function renderView(){let m=$('#main');if(!m)return;m.innerHTML='<div class="card">Loading…</div>';try{if(S.view==='feed')await viewFeed();if(S.view==='friends')await viewFriends();if(S.view==='messages')await viewMessages();if(S.view==='notifications')await viewNotifications();if(S.view==='games')viewGames();if(S.view==='profile')viewProfile();await updateOnlineStudents()}catch(e){console.error(e);m.innerHTML=`<div class="card"><b>Error</b><p>${esc(e.message)}</p></div>`}}
async function viewFeed(){let {data,error}=await db.from('posts').select('id,user_id,body,created_at,post_type,poll_question,poll_options,is_friends_only,school').order('created_at',{ascending:false}).limit(50);if(error)throw error;let html=`<div class="head"><h1 class="title">Feed</h1><button class="btn" id="new-post">✨ Create Post</button></div><div class="filter-tabs"><button class="filter-tab ${S.feedFilter==='all'?'active':''}" data-filter="all">All</button><button class="filter-tab ${S.feedFilter==='friends'?'active':''}" data-filter="friends">Friends Only</button><button class="filter-tab ${S.feedFilter==='my-school'?'active':''}" data-filter="my-school">My School</button></div>`;let filteredPosts=data||[];if(S.feedFilter==='friends'){filteredPosts=filteredPosts.filter(p=>S.friendIds.has(p.user_id))}if(S.feedFilter==='my-school'){filteredPosts=filteredPosts.filter(p=>p.school===S.profile.school)}if(filteredPosts.length){let users=await Promise.all(filteredPosts.map(p=>db.from('profiles').select('*').eq('id',p.user_id).single()));let likes=await db.from('post_likes').select('post_id').in('post_id',filteredPosts.map(p=>p.id));let likeMap={};likes.data?.forEach(l=>likeMap[l.post_id]=(likeMap[l.post_id]||0)+1);let liked=await db.from('post_likes').select('post_id').in('post_id',filteredPosts.map(p=>p.id)).eq('user_id',S.session.user.id);let likedSet=new Set(liked.data?.map(l=>l.post_id));html+=filteredPosts.map((p,i)=>postCard(p,users[i].data,likedSet.has(p.id),likeMap[p.id]||0)).join('')}else{html+='<div class="card"><p style="text-align:center;color:var(--muted)">No posts yet. Be the first!</p></div>'}$('#main').innerHTML=html;$$('.filter-tab').forEach(b=>b.onclick=()=>{S.feedFilter=b.dataset.filter;renderView()});document.getElementById('new-post')?.addEventListener('click',showPostComposer);$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like,b.classList.contains('active')))}
function postCard(p,profile,liked,count){const isOwn=p.user_id===S.session.user.id;const isFriend=S.friendIds.has(p.user_id);return `<article class="card"><div class="post-top"><span class="avatar">${initials(profile?.nickname)}</span><div style="flex:1"><b>${esc(profile?.nickname)}</b><div class="post-meta">${new Date(p.created_at).toLocaleDateString()}${p.school?`<span class="post-school">${esc(p.school)}</span>`:''}${p.is_friends_only?'<span class="post-school" style="background:var(--red);color:white">🔒 Private</span>':''}</div></div>${isOwn?`<button class="btn-secondary" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px" data-delete-post="${p.id}">×</button>`:''}</div>${p.post_type==='poll'?`<div><b>${esc(p.poll_question)}</b><div style="margin-top:8px">${(p.poll_options||[]).map(o=>`<div class="btn btn-secondary" style="margin-bottom:4px;text-align:left;width:100%;cursor:default">${esc(o)}</div>`).join('')}</div></div>`:`<p>${esc(p.body)}</p>`}<div class="post-actions"><button class="post-action-btn ${liked?'active':''}" data-like="${p.id}">❤️ ${count}</button><button class="post-action-btn" data-comment="${p.id}">💬 Reply</button><button class="post-action-btn" data-share="${p.id}">↗️ Share</button></div></article>`}
async function toggleLike(id,liked){let q=liked?db.from('post_likes').delete().eq('post_id',id).eq('user_id',S.session.user.id):db.from('post_likes').insert({post_id:id,user_id:S.session.user.id});let {error}=await q;if(error)console.error(error);renderView()}
async function deletePost(id){if(confirm('Delete this post?')){await db.from('posts').delete().eq('id',id);renderView()}}
function showPostComposer(){modal('Create a Post',`<div class="composer"><textarea class="composer-input" id="postText" placeholder="What's on your mind?"></textarea><div class="composer-options"><button class="btn btn-secondary" id="pollBtn">📊 Poll</button><button class="btn btn-secondary" id="friendsOnlyBtn">🔒 Friends Only</button></div><div id="pollOptions" style="display:none;margin-top:12px"><label>Question</label><input id="pollQuestion" maxlength="180" placeholder="Ask something..."><label style="margin-top:8px">Options</label>${[1,2,3,4].map(n=>`<input id="pollOpt${n}" maxlength="100" placeholder="Option ${n}" style="margin-bottom:8px">`).join('')}</div><button class="btn" id="submitPost" style="width:100%;margin-top:16px">Post</button></div>`);let friendsOnly=false;document.getElementById('friendsOnlyBtn').onclick=()=>{friendsOnly=!friendsOnly;document.getElementById('friendsOnlyBtn').classList.toggle('active');toast(friendsOnly?'This post will be visible to friends only':'This post will be public')};document.getElementById('pollBtn').onclick=()=>{document.getElementById('pollOptions').style.display=document.getElementById('pollOptions').style.display==='none'?'block':'none'};document.getElementById('submitPost').onclick=async()=>{const text=document.getElementById('postText').value.trim();const pollQ=document.getElementById('pollQuestion')?.value.trim();const isPoll=document.getElementById('pollOptions').style.display==='block'&&pollQ;if(!text&&!isPoll){toast('Write something!');return}if(isPoll){const opts=[1,2,3,4].map(n=>document.getElementById(`pollOpt${n}`).value.trim()).filter(o=>o);if(opts.length<2){toast('Need at least 2 options');return}await db.from('posts').insert({user_id:S.session.user.id,post_type:'poll',poll_question:pollQ,poll_options:opts,is_friends_only:friendsOnly,school:S.profile.school})}else{await db.from('posts').insert({user_id:S.session.user.id,body:text,post_type:'text',is_friends_only:friendsOnly,school:S.profile.school})}closeModal();renderView();toast('Posted! 🎉')}}
async function viewFriends(){let {data,error}=await db.from('profiles').select('id,nickname,school').neq('id',S.session.user.id).order('nickname').limit(100);if(error)throw error;let {data:sent}=await db.from('friend_requests').select('to_id').eq('from_id',S.session.user.id);let {data:recv}=await db.from('friend_requests').select('from_id').eq('to_id',S.session.user.id);let sentSet=new Set(sent?.map(r=>r.to_id));let recvSet=new Set(recv?.map(r=>r.from_id));let friendSet=S.friendIds;let html=`<div class="head"><h1 class="title">Friends</h1><span class="tiny">${friendSet.size} friends • ${recvSet.size} requests</span></div>`;if(recvSet.size>0){html+='<div style="margin-bottom:16px"><h3 style="margin:0 0 12px 0">Friend Requests</h3>'+Array.from(recvSet).map(id=>{let p=data.find(x=>x.id===id);return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(p?.nickname)}</b><div class="tiny">${esc(p?.school||'No school')}</div></div><div style="display:flex;gap:8px"><button class="btn btn-sm" data-accept="${id}">✓ Accept</button><button class="btn-secondary btn-sm" style="border:none;background:none;color:var(--muted);cursor:pointer" data-decline="${id}">✕</button></div></div></div>`}).join('')+'</div>'}html+='<h3 style="margin:16px 0 12px 0">Browse Students</h3>';html+=data?.map(p=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(p.nickname)}</b><div class="tiny">${esc(p.school||'No school')}</div></div><div style="display:flex;gap:8px">${friendSet.has(p.id)?`<button class="btn btn-secondary btn-sm" data-messagefriend="${p.id}">💬</button>`:recvSet.has(p.id)?`<button class="btn btn-sm" data-accept="${p.id}">Accept</button><button class="btn-secondary btn-sm" style="border:none;background:none;color:var(--muted);cursor:pointer" data-decline="${p.id}">✕</button>`:sentSet.has(p.id)?`<button class="btn btn-secondary btn-sm" disabled>Pending...</button>`:`<button class="btn btn-sm" data-add="${p.id}">+ Add</button>`}</div></div></div>`).join('');$('#main').innerHTML=html;wireActions()}
async function startConversation(friendId){if(!S.friendIds.has(friendId))return toast('Add this student as a friend first.');const me=S.session.user.id;const [user_a,user_b]=[me,friendId].sort();let {data,error}=await db.from('conversations').select('id').eq('user_a',user_a).eq('user_b',user_b).maybeSingle();if(error)throw error;if(!data){let {data:newConvo,error:createErr}=await db.from('conversations').insert({user_a,user_b}).select();if(createErr)throw createErr;data=newConvo[0]}S.chat=data.id;await viewMessages()}
async function viewMessages(){await loadConvos();let html=`<div class="head"><div><h1 class="title">Direct Messages</h1><span class="tiny">${S.convos.length} conversations</span></div></div>`;if(S.convos.length===0){html+='<div class="card"><p style="text-align:center;color:var(--muted)">No messages yet. Add a friend to start chatting!</p></div>'}else{html+=S.convos.map(c=>`<div class="card" data-convo="${c.id}" style="cursor:pointer;transition:all 0.2s"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${esc(c.otherNickname)}</b><div class="tiny">${esc(c.lastMessage||'No messages yet')}</div></div><span class="tiny" style="color:var(--mint)">›</span></div></div>`).join('')}$('#main').innerHTML=html;$$('[data-convo]').forEach(el=>{el.onclick=async()=>{S.chat=el.dataset.convo;let {data,error}=await db.from('messages').select('*').eq('convo_id',S.chat).order('created_at');if(error)throw error;let convoData=S.convos.find(c=>c.id===S.chat);let messagesHtml=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><button class="btn btn-secondary btn-sm" id="backMsg">← Back</button><b>${esc(convoData?.otherNickname)}</b><div style="width:40px"></div></div><div style="flex:1;overflow-y:auto;margin-bottom:16px;min-height:300px">${(data||[]).map(m=>`<div class="message ${m.sender_id===S.session.user.id?'sent':'received'}"><div class="bubble">${esc(m.body)}</div><div class="message-time">${new Date(m.created_at).toLocaleTimeString()}</div></div>`).join('')}</div><form id="msgForm" style="display:flex;gap:8px"><input id="msgText" placeholder="Type a message..." style="flex:1"><button type="submit" class="btn btn-sm">Send</button></form>`;$('#main').innerHTML=messagesHtml;document.getElementById('backMsg').onclick=()=>viewMessages();const msgForm=document.getElementById('msgForm');if(msgForm){msgForm.onsubmit=async e=>{e.preventDefault();let text=document.getElementById('msgText').value.trim();if(!text)return;await db.from('messages').insert({convo_id:S.chat,sender_id:S.session.user.id,body:text,nickname:S.profile.nickname});document.getElementById('msgText').value='';const messagesContainer=document.querySelector('[style*="overflow-y"]');if(messagesContainer)messagesContainer.scrollTop=messagesContainer.scrollHeight}}}})}
async function loadConvos(){let {data,error}=await db.from('conversations').select('*').or(`user_a.eq.${S.session.user.id},user_b.eq.${S.session.user.id}`);if(error)throw error;S.convos=(data||[]).map(c=>{let otherId=c.user_a===S.session.user.id?c.user_b:c.user_a;return{id:c.id,otherNickname:c.other_nickname||'Student',lastMessage:c.last_message||''}})}
async function viewNotifications(){let {data:reqs}=await db.from('friend_requests').select('from_id,profiles!friend_requests_from_id_fkey(nickname)').eq('to_id',S.session.user.id);let html=`<div class="head"><h1 class="title">Notifications</h1><span class="tiny">${reqs?.length||0} pending requests</span></div>`;if(!reqs||reqs.length===0){html+='<div class="card"><p style="text-align:center;color:var(--muted)">All caught up! 🎉</p></div>'}else{html+=reqs.map(r=>`<div class="notification-item"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(r.profiles?.nickname)}</b> sent you a friend request</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-sm" data-accept="${r.from_id}">Accept</button><button class="btn-secondary btn-sm" data-decline="${r.from_id}">Decline</button></div></div>`).join('')}$('#main').innerHTML=html;wireActions()}
function viewGames(){let gs=[['⭕❌','Tic-Tac-Toe','Two players on one device','ttt'],['🧠','Student Quiz','General knowledge','quiz'],['🔵🟡','Connect Four','Connect four in a row','connect']];$('#main').innerHTML=`<div class="head"><h1 class="title">Games</h1><span class="tiny">Coming soon!</span></div>${gs.map(g=>`<div class="card" style="cursor:pointer;opacity:0.6"><span style="font-size:24px">${g[0]}</span> <b>${g[1]}</b><div class="tiny">${g[2]}</div></div>`).join('')}`}
function viewProfile(){let p=S.profile;$('#main').innerHTML=`<div class="head"><h1 class="title">My Profile</h1></div><div class="card"><div style="text-align:center;margin-bottom:16px"><div class="avatar" style="width:80px;height:80px;font-size:32px;margin:0 auto;margin-bottom:12px">${initials(p.nickname)}</div><b>${esc(p.nickname)}</b><div class="tiny">${esc(p.school||'No school')}</div></div><form id="profileForm"><div class="field"><label>Nickname</label><input id="profileNick" value="${esc(p.nickname)}" required></div><div class="field"><label>School</label><input id="profileSchool" value="${esc(p.school||'')}"></div><button type="submit" class="btn" style="width:100%">Save Changes</button></form></div>`;document.getElementById('profileForm').onsubmit=async e=>{e.preventDefault();let {error}=await db.from('profiles').update({nickname:document.getElementById('profileNick').value.trim(),school:document.getElementById('profileSchool').value.trim()}).eq('id',S.session.user.id);if(error){console.error(error);toast('Error updating profile')}else{await loadProfile();toast('Profile updated! ✓');renderView()}}}
async function updateOnlineStudents(){let {data}=await db.from('profiles').select('id,nickname,school').neq('id',S.session.user.id).limit(10);let html=(data||[]).map(p=>`<div class="card" style="padding:12px;cursor:pointer" data-messagefriend="${p.id}"><div style="display:flex;gap:8px;align-items:center"><div style="width:8px;height:8px;background:var(--mint);border-radius:50%;flex-shrink:0"></div><div style="flex:1"><b>${esc(p.nickname)}</b><div class="tiny">${esc(p.school||'No school')}</div></div></div></div>`).join('');$('#online-students').innerHTML=html||'<div class="tiny" style="text-align:center;color:var(--muted)">No one online</div>';$('#online-count').textContent=data?.length||0;$$('[data-messagefriend]').forEach(b=>b.onclick=()=>startConversation(b.dataset.messagefriend))}
async function addFriend(id){await db.from('friend_requests').insert({from_id:S.session.user.id,to_id:id});toast('Friend request sent! 🎉');renderView()}
async function acceptFriend(id){const me=S.session.user.id;const [user_a,user_b]=[me,id].sort();await db.from('friendships').insert({user_id:user_a,friend_id:user_b});await db.from('friendships').insert({user_id:user_b,friend_id:user_a});await db.from('friend_requests').delete().or(`and(from_id.eq.${id},to_id.eq.${me}),and(from_id.eq.${me},to_id.eq.${id})`);await loadFriends();toast('Friend added! 👋');renderView()}
async function declineFriend(id){const me=S.session.user.id;await db.from('friend_requests').delete().or(`and(from_id.eq.${id},to_id.eq.${me}),and(from_id.eq.${me},to_id.eq.${id})`);renderView()}
function setView(v){S.view=v;renderView()}
function modal(title,content){$('#modaltitle').textContent=title;$('#modalcontent').innerHTML=content;$('#modalbg').classList.add('show')}
function closeModal(){$('#modalbg').classList.remove('show')}
function wireActions(){$$('[data-messagefriend]').forEach(b=>b.onclick=()=>startConversation(b.dataset.messagefriend));$$('[data-add]').forEach(b=>b.onclick=()=>addFriend(b.dataset.add));$$('[data-accept]').forEach(b=>b.onclick=()=>acceptFriend(b.dataset.accept));$$('[data-decline]').forEach(b=>b.onclick=()=>declineFriend(b.dataset.decline));$$('[data-delete-post]').forEach(b=>b.onclick=()=>deletePost(b.dataset.deletePost))}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){e.preventDefault();setView(v.dataset.view);return}});
(async()=>{if(!configured){renderAuth('signup','Setup needed: create Supabase project, run supabase_schema.sql, and replace the two placeholders in index.html.');return}await boot()})();
</script></body></html>
