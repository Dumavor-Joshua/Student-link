const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const S={session:null,profile:null,view:'feed',friends:[],requests:[],convos:[],chat:null,channel:null,game:'',ttt:Array(9).fill(''),turn:'X',quiz:0,score:0,connect:Array.from({length:6},()=>Array(7).fill(0)),cturn:1,guess:0,tries:0,word:'',wordtries:5};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(s='S'){return esc(s.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'S')}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),2800)}function ago(d){let n=Math.max(0,(Date.now()-new Date(d))/1000|0);return n<60?'just now':n<3600?(n/60|0)+'m ago':n<86400?(n/3600|0)+'h ago':(n/86400|0)+'d ago'}function modal(t,h){$('#modaltitle').textContent=t;$('#modalcontent').innerHTML=h;$('#modalbg').classList.add('open')}function closeModal(){$('#modalbg').classList.remove('open')}$('#closemodal').onclick=closeModal;$('#modalbg').onclick=e=>{if(e.target===$('#modalbg'))closeModal()};
function authHTML(tab='signup',message=''){return `<div class="auth"><section class="hero"><div class="brand"><span class="brandicon">🎮</span>StudentLink</div><h1>School friends.<br><span style="color:#9bbaff">New challenges.</span><br>Your community.</h1><p>Meet students, make friends, chat privately, share opinions and play games together.</p><p>✓ Public nickname · ✓ School communities · ✓ Games and conversations</p></section><section class="authbox"><div class="authcard"><h2>Welcome to StudentLink</h2><p class="muted">A student community built around connection and play.</p>${message?`<div class="note">${esc(message)}</div>`:''}<div class="tabs"><button data-tab="login" class="${tab==='login'?'active':''}">Log in</button><button data-tab="signup" class="${tab==='signup'?'active':''}">Create account</button></div><form id="authform"><div id="signupfields" class="${tab==='login'?'hidden':''}"><div class="field"><label>Public nickname</label><input id="nick" minlength="3" maxlength="24" required placeholder="CampusStar"></div><div class="field"><label>School (optional)</label><input id="school" maxlength="90" placeholder="School name"></div></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password (8+ characters)</label><input id="password" type="password" minlength="8" required autocomplete="${tab==='login'?'current-password':'new-password'}"></div><button class="btn primary full" id="authsubmit">${tab==='login'?'Log in':'Create my account'} →</button></form><div class="note">Use a nickname publicly. Never share your home address, phone number, password, timetable, or student ID. A nickname is not complete anonymity.</div><p class="tiny">This early build needs moderation and child-safety review before a broad public launch.</p></div></section></div>`}
function renderAuth(tab='signup',msg=''){ $('#app').innerHTML=authHTML(tab,msg);$$('[data-tab]').forEach(b=>b.onclick=()=>renderAuth(b.dataset.tab));$('#authform').onsubmit=async e=>{e.preventDefault();if(!db)return toast('Configure Supabase using README.md first.');let email=$('#email').value.trim(),password=$('#password').value,nick=$('#nick')?.value.trim(),school=$('#school')?.value.trim();$('#authsubmit').disabled=true;try{if(tab==='signup'){if(nick.length<3)throw Error('Nickname needs at least 3 characters.');let {data,error}=await db.auth.signUp({email,password,options:{data:{nickname:nick,school:school||''}}});if(error)throw error;if(data.session)await boot();else renderAuth('login','Check your email for a confirmation link, then log in.')}else{let {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await boot()}}catch(err){renderAuth(tab,err.message||'Could not complete that action.')}finally{if($('#authsubmit'))$('#authsubmit').disabled=false}}}
function nav(v,ico,label){return `<button class="navitem ${S.view===v?'active':''}" data-view="${v}"><span>${ico}</span><span>${label}</span></button>`}function shell(){return `<header class="header"><a class="brand" data-view="feed"><span class="brandicon">🎮</span>StudentLink</a><div class="search"><input id="search" placeholder="Find students by nickname…"></div><div class="actions"><button class="btn secondary" data-view="games">🎮 Games</button><button class="btn secondary" data-view="profile">👤</button><button class="btn secondary" id="logout">Log out</button></div></header><div class="layout"><aside class="side leftside"><div class="row"><span class="avatar">${initials(S.profile.nickname)}</span><div><b>${esc(S.profile.nickname)}</b><div class="tiny">${esc(S.profile.school||'Student')}</div></div></div><div class="label">Your space</div>${nav('feed','🏠','News feed')}${nav('friends','👥','Friends')}${nav('messages','💬','Private messages')}${nav('schools','🏫','Schools')}${nav('polls','📊','Polls & opinions')}${nav('games','🎮','Games')}${nav('profile','⚙️','My profile')}<div class="note">Be kind. Protect your privacy. Report abusive behaviour.</div></aside><main class="main" id="main"><div class="card">Loading…</div></main><aside class="side rightside"><h3 class="righttitle">Friend requests</h3><div id="requests">Loading…</div><hr style="border:0;border-top:1px solid #25416b;margin:14px 0"><h3 class="righttitle">Your friends</h3><div id="friendshort">Loading…</div><div class="note">Only accept requests from people you recognise. Never send money to people you meet online.</div></aside></div><nav class="mobile">${nav('feed','🏠','Home')}${nav('friends','👥','Friends')}${nav('messages','💬','Chat')}${nav('games','🎮','Games')}${nav('profile','👤','Profile')}</nav>`}
async function boot(){if(!db){renderAuth('signup','Setup needed: create a Supabase project, run supabase_schema.sql, and replace the two configuration placeholders in index.html.');return}let {data:{session}}=await db.auth.getSession();S.session=session;if(!session){renderAuth();return}await loadProfile();$('#app').innerHTML=shell();$('#logout').onclick=async()=>{if(S.channel)await db.removeChannel(S.channel);await db.auth.signOut();S.session=null;renderAuth('login','You have logged out.')};$('#search').onkeydown=e=>{if(e.key==='Enter')searchPeople(e.target.value)};await Promise.all([loadFriends(),loadRequests()]);await renderView();setupRealtime();db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')renderAuth('login')})}
async function loadProfile(){let {data,error}=await db.from('profiles').select('*').eq('id',S.session.user.id).maybeSingle();if(error)console.warn(error);S.profile=data||{id:S.session.user.id,nickname:S.session.user.user_metadata?.nickname||'Student',school:S.session.user.user_metadata?.school||''};if(!data){let {error:e}=await db.from('profiles').upsert({id:S.profile.id,nickname:S.profile.nickname,school:S.profile.school});if(e)console.warn(e.message)}}async function loadFriends(){let {data,error}=await db.from('friendships').select('id,user_id,friend_id,status').or(`user_id.eq.${S.session.user.id},friend_id.eq.${S.session.user.id}`).eq('status','accepted');if(error){S.friends=[];return}let ids=(data||[]).map(x=>x.user_id===S.session.user.id?x.friend_id:x.user_id);let {data:p}=ids.length?await db.from('profiles').select('id,nickname,school').in('id',ids):{data:[]};S.friends=p||[]}async function loadRequests(){let {data}=await db.from('friendships').select('id,user_id,friend_id').eq('friend_id',S.session.user.id).eq('status','pending');let ids=(data||[]).map(x=>x.user_id);let {data:p}=ids.length?await db.from('profiles').select('id,nickname,school').in('id',ids):{data:[]};S.requests=(data||[]).map(x=>({...x,profile:(p||[]).find(y=>y.id===x.user_id)}));sidebars()}function sidebars(){let r=$('#requests'),f=$('#friendshort');if(!r||!f)return;r.innerHTML=S.requests.length?S.requests.map(x=>`<div class="friendline"><span class="avatar">${initials(x.profile?.nickname)}</span><div class="details"><strong>${esc(x.profile?.nickname||'Student')}</strong></div><button class="btn mint" data-accept="${x.id}">✓</button></div>`).join(''):'<p class="tiny">No pending requests.</p>';f.innerHTML=S.friends.slice(0,6).map(x=>`<div class="friendline"><span class="avatar">${initials(x.nickname)}</span><div class="details"><strong>${esc(x.nickname)}</strong><small>${esc(x.school||'Student')}</small></div></div>`).join('')||'<p class="tiny">Friends appear here.</p>'}
async function renderView(){let m=$('#main');if(!m)return;m.innerHTML='<div class="card">Loading…</div>';try{if(S.view==='feed')await viewFeed();if(S.view==='friends')await viewFriends();if(S.view==='messages')await viewMessages();if(S.view==='games')viewGames();if(S.view==='profile')viewProfile();if(S.view==='schools')await viewSchools();if(S.view==='polls')await viewPolls()}catch(e){m.innerHTML=`<div class="card"><h2>Could not load section</h2><p class="muted">${esc(e.message)}</p><button class="btn secondary" id="retry">Retry</button></div>`;$('#retry').onclick=renderView}}
async function viewFeed(){let {data,error}=await db.from('posts').select('id,user_id,body,created_at,post_type,poll_question,poll_options').order('created_at',{ascending:false}).limit(40);if(error)throw error;let ids=[...new Set((data||[]).map(x=>x.user_id))];let {data:ps}=ids.length?await db.from('profiles').select('id,nickname,school').in('id',ids):{data:[]};let pm=Object.fromEntries((ps||[]).map(x=>[x.id,x]));let {data:likes}=await db.from('post_likes').select('post_id,user_id');let lc={},liked=new Set();(likes||[]).forEach(x=>{lc[x.post_id]=(lc[x.post_id]||0)+1;if(x.user_id===S.session.user.id)liked.add(x.post_id)});let {data:comments}=await db.from('comments').select('post_id');let cc={};(comments||[]).forEach(x=>cc[x.post_id]=(cc[x.post_id]||0)+1);$('#main').innerHTML=`<div class="head"><div><h1 class="title">News feed</h1><span class="tiny">What students are talking about</span></div><button class="btn secondary" data-view="polls">📊 Polls</button></div><section class="card"><div class="compose row" style="align-items:flex-start"><span class="avatar">${initials(S.profile.nickname)}</span><div style="flex:1"><textarea id="postbody" maxlength="1500" placeholder="What's on your mind? Keep it respectful…" style="width:100%;background:#071630;color:white;border:1px solid #294b80;border-radius:10px;padding:11px;min-height:78px"></textarea><div class="spread"><span class="tiny">Don't post private information.</span><button class="btn primary" id="publish">Post</button></div></div></div><hr style="border:0;border-top:1px solid #25416b;margin:14px 0"><button class="btn secondary" id="newpoll">📊 Create a poll</button></section>${(data||[]).map(p=>postCard(p,pm[p.user_id],liked.has(p.id),lc[p.id]||0,cc[p.id]||0)).join('')||'<div class="card empty">💬<h3>Your feed starts here</h3>Be the first to share a question or idea.</div>'}`;$('#publish').onclick=async()=>{let body=$('#postbody').value.trim();if(!body)return toast('Write something first.');if(/my password is|my home address is|my phone number is|kill yourself/i.test(body))return toast('Please remove private or harmful information.');let {error}=await db.from('posts').insert({user_id:S.session.user.id,body,post_type:'text'});if(error)toast(error.message);else{toast('Post published');viewFeed()}};$('#newpoll').onclick=createPoll;$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like,b.dataset.liked==='true'));$$('[data-comments]').forEach(b=>b.onclick=()=>openComments(b.dataset.comments));$$('[data-report]').forEach(b=>b.onclick=()=>reportPost(b.dataset.report));$$('[data-vote]').forEach(b=>b.onclick=()=>vote(b.dataset.vote,+b.dataset.option))}
function postCard(p,profile,liked,count,comments){return `<article class="card"><div class="post-top"><span class="avatar">${initials(profile?.nickname)}</span><div style="flex:1"><b>${esc(profile?.nickname||'Student')}</b><div class="meta">${esc(profile?.school||'StudentLink member')} · ${ago(p.created_at)}</div></div></div><div class="post-body">${esc(p.body)}</div>${p.post_type==='poll'?`<b>${esc(p.poll_question||p.body)}</b>${(p.poll_options||[]).map((o,i)=>`<button class="btn secondary full" style="margin-top:6px" data-vote="${p.id}" data-option="${i}">${esc(o)}</button>`).join('')}`:''}<div class="post-actions"><button data-like="${p.id}" data-liked="${liked}">${liked?'💙 Liked':'♡ Like'} · ${count}</button><button data-comments="${p.id}">💬 Comment · ${comments}</button><button data-report="${p.id}">⚑ Report</button></div></article>`}
async function toggleLike(id,liked){let q=liked?db.from('post_likes').delete().eq('post_id',id).eq('user_id',S.session.user.id):db.from('post_likes').insert({post_id:id,user_id:S.session.user.id});let {error}=await q;if(error)toast(error.message);await viewFeed()}async function openComments(id){let {data,error}=await db.from('comments').select('id,user_id,body,created_at').eq('post_id',id).order('created_at');if(error)return toast(error.message);let ids=[...new Set((data||[]).map(x=>x.user_id))],{data:ps}=ids.length?await db.from('profiles').select('id,nickname').in('id',ids):{data:[]},pm=Object.fromEntries((ps||[]).map(x=>[x.id,x.nickname]));modal('Comments',`<div>${(data||[]).map(c=>`<p><b>${esc(pm[c.user_id]||'Student')}</b><br>${esc(c.body)}<br><small class="tiny">${ago(c.created_at)}</small></p>`).join('')||'<p class="muted">No comments yet.</p>'}</div><form id="commentform"><div class="field"><label>Add a comment</label><textarea id="commentbody" maxlength="600" required></textarea></div><button class="btn primary">Comment</button></form>`);$('#commentform').onsubmit=async e=>{e.preventDefault();let {error}=await db.from('comments').insert({post_id:id,user_id:S.session.user.id,body:$('#commentbody').value.trim()});if(error)toast(error.message);else{closeModal();await viewFeed()}}}
function createPoll(){modal('Create a poll',`<form id="pollform"><div class="field"><label>Question</label><input id="pq" maxlength="180" required></div>${[1,2,3,4].map((n)=>`<div class="field"><label>Option ${n}${n>2?' (optional)':''}</label><input id="po${n}" maxlength="90" ${n<3?'required':''}></div>`).join('')}<button class="btn primary">Publish poll</button></form>`);$('#pollform').onsubmit=async e=>{e.preventDefault();let opts=[1,2,3,4].map(n=>$('#po'+n).value.trim()).filter(Boolean),q=$('#pq').value.trim();let {error}=await db.from('posts').insert({user_id:S.session.user.id,body:q,post_type:'poll',poll_question:q,poll_options:opts});if(error)toast(error.message);else{closeModal();setView('feed');toast('Poll published')}}}async function vote(id,i){let {error}=await db.from('poll_votes').upsert({post_id:id,user_id:S.session.user.id,option_index:i},{onConflict:'post_id,user_id'});toast(error?error.message:'Vote recorded')}
async function viewFriends(){let {data,error}=await db.from('profiles').select('id,nickname,school').neq('id',S.session.user.id).order('nickname').limit(100);if(error)throw error;let {data:sent}=await db.from('friendships').select('friend_id').eq('user_id',S.session.user.id);let known=new Set([...S.friends.map(x=>x.id),...(sent||[]).map(x=>x.friend_id)]);let render=arr=>arr.map(p=>`<div class="friendline"><span class="avatar">${initials(p.nickname)}</span><div class="details"><strong>${esc(p.nickname)}</strong><small>${esc(p.school||'StudentLink member')}</small></div>${S.friends.some(f=>f.id===p.id)?`<button class="btn secondary" data-messagefriend="${p.id}">💬 Message</button>`:known.has(p.id)?'<span class="tiny">Request pending</span>':`<button class="btn secondary" data-add="${p.id}">＋ Add</button>`}</div>`).join('')||'<p class="muted">No students found.</p>';$('#main').innerHTML=`<div class="head"><div><h1 class="title">Find students</h1><span class="tiny">Add friends to chat privately</span></div></div><div class="card"><div class="field"><label>Search nickname or school</label><input id="peoplefilter" placeholder="Start typing…"></div><div id="people">${render(data||[])}</div></div><div class="card"><h2 class="title">Friend requests</h2>${S.requests.map(x=>`<div class="friendline"><span class="avatar">${initials(x.profile?.nickname)}</span><div class="details"><strong>${esc(x.profile?.nickname||'Student')}</strong></div><button class="btn mint" data-accept="${x.id}">Accept</button></div>`).join('')||'<p class="muted">No pending requests.</p>'}</div>`;$('#peoplefilter').oninput=()=>{let q=$('#peoplefilter').value.toLowerCase();$('#people').innerHTML=render((data||[]).filter(p=>(p.nickname+' '+p.school).toLowerCase().includes(q)));wireActions()};wireActions()}async function addFriend(id){let {error}=await db.from('friendships').insert({user_id:S.session.user.id,friend_id:id,status:'pending'});toast(error?(error.code==='23505'?'Request already exists.':error.message):'Friend request sent');if(!error)await viewFriends()}async function accept(id){let {error}=await db.from('friendships').update({status:'accepted'}).eq('id',id).eq('friend_id',S.session.user.id);if(error)toast(error.message);else{toast('Friend added');await Promise.all([loadFriends(),loadRequests()]);await renderView()}}
async function startConversation(friendId){if(!S.friends.some(f=>f.id===friendId))return toast('Add this student as a friend first.');const me=S.session.user.id;const [user_a,user_b]=[me,friendId].sort();let {data,error}=await db.from('conversations').select('id').eq('user_a',user_a).eq('user_b',user_b).maybeSingle();if(error)return toast(error.message);if(!data){const result=await db.from('conversations').insert({user_a,user_b}).select('id').single();if(result.error)return toast(result.error.message);data=result.data}await loadConvos();S.view='messages';await renderView();await openChat(data.id)}
async function viewMessages(){await loadConvos();$('#main').innerHTML=`<div class="head"><div><h1 class="title">Private messages</h1><span class="tiny">Messaging is limited to accepted friends.</span></div></div><div class="card"><div class="chatlayout"><div class="chatlist" id="chatlist">${S.convos.map(c=>`<div class="chatperson" data-chat="${c.id}"><span class="avatar">${initials(c.profile?.nickname)}</span><div><strong>${esc(c.profile?.nickname||'Friend')}</strong><div class="tiny">Conversation</div></div></div>`).join('')||'<p class="tiny">Add a friend first.</p>'}</div><div class="room" id="room"><div class="empty">👋<p>Select a friend to chat.</p></div></div></div></div>`;$$('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat))}async function loadConvos(){let {data,error}=await db.from('conversations').select('id,user_a,user_b,updated_at').or(`user_a.eq.${S.session.user.id},user_b.eq.${S.session.user.id}`).order('updated_at',{ascending:false});if(error){S.convos=[];return}let ids=(data||[]).map(c=>c.user_a===S.session.user.id?c.user_b:c.user_a),friends=new Set(S.friends.map(x=>x.id));let relevant=(data||[]).filter(c=>friends.has(c.user_a===S.session.user.id?c.user_b:c.user_a));let pmap=Object.fromEntries(S.friends.map(p=>[p.id,p]));S.convos=relevant.map(c=>({...c,profile:pmap[c.user_a===S.session.user.id?c.user_b:c.user_a]}))}async function openChat(id){S.chat=id;let c=S.convos.find(x=>x.id===id);if(!c)return;$('#room').innerHTML=`<div class="row"><span class="avatar">${initials(c.profile?.nickname)}</span><b>${esc(c.profile?.nickname||'Friend')}</b></div><div class="messages" id="messages">Loading…</div><form class="chat-send" id="sendform"><input id="message" maxlength="1500" required placeholder="Write a message…"><button class="btn primary">Send</button></form><p class="tiny">Never send passwords, private location, intimate images, or money.</p>`;await loadMessages(id);$('#sendform').onsubmit=async e=>{e.preventDefault();let body=$('#message').value.trim();if(!body)return;let {error}=await db.from('messages').insert({conversation_id:id,sender_id:S.session.user.id,body});if(error)toast(error.message);else{$('#message').value='';await loadMessages(id)}};if(S.channel)await db.removeChannel(S.channel);S.channel=db.channel('chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${id}`},p=>{if(p.new.sender_id!==S.session.user.id)loadMessages(id)}).subscribe()}async function loadMessages(id){let {data,error}=await db.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',id).order('created_at').limit(150);if(error){toast(error.message);return}let el=$('#messages');if(!el)return;el.innerHTML=(data||[]).map(m=>`<div class="bubble ${m.sender_id===S.session.user.id?'mine':''}">${esc(m.body)}<small>${ago(m.created_at)}</small></div>`).join('')||'<p class="muted">Say hello to start.</p>';el.scrollTop=el.scrollHeight}
function viewGames(){let gs=[['⭕❌','Tic-Tac-Toe','Two players on one device','ttt'],['🧠','Student Quiz','General knowledge','quiz'],['🔵🟡','Connect Four','Connect four in a row','connect'],['✊✋✌️','Rock Paper Scissors','Play against the computer','rps'],['🔢','Number Guess','Guess a number from 1 to 20','guess'],['🧩','Word Scramble','Unscramble a school-themed word','word']];$('#main').innerHTML=`<div class="head"><div><h1 class="title">Game zone</h1><span class="tiny">Play for fun. Compete respectfully.</span></div></div><div class="games">${gs.map(g=>`<article class="game"><div class="gameart">${g[0]}</div><h3>${g[1]}</h3><p>${g[2]}</p><button class="btn primary" data-game="${g[3]}">Play →</button></article>`).join('')}</div><div class="note">Browser games are local. Online matchmaking and server-verified scores are not implemented yet.</div>`;$$('[data-game]').forEach(b=>b.onclick=()=>startGame(b.dataset.game))}const qs=[{q:'Which planet is known as the Red Planet?',a:['Venus','Mars','Jupiter','Mercury'],c:1},{q:'What is the chemical symbol for water?',a:['CO₂','O₂','H₂O','NaCl'],c:2},{q:'How many sides does a hexagon have?',a:['Five','Six','Seven','Eight'],c:1},{q:'Which is renewable energy?',a:['Coal','Diesel','Solar','Natural gas'],c:2},{q:'Which organ pumps blood?',a:['Lungs','Brain','Heart','Liver'],c:2}];function startGame(g){S.game=g;if(g==='ttt'){S.ttt=Array(9).fill('');S.turn='X'}if(g==='connect'){S.connect=Array.from({length:6},()=>Array(7).fill(0));S.cturn=1}if(g==='quiz'){S.quiz=0;S.score=0}if(g==='guess'){S.guess=1+Math.floor(Math.random()*20);S.tries=0}if(g==='word'){S.word=['PLANET','SCHOOL','FRIEND','PUZZLE','SCIENCE'][Math.floor(Math.random()*5)];S.wordtries=5}modal('Game: '+g[0].toUpperCase()+g.slice(1),'<div id="gamecontent"></div>');drawGame()}function tttWin(b){for(let [a,c,d] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return ''}function cWin(b){for(let r=0;r<6;r++)for(let c=0;c<7;c++){let v=b[r][c];if(!v)continue;for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let n=1;for(let k=1;k<4;k++){let rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>5||cc<0||cc>6||b[rr][cc]!==v)break;n++}if(n>=4)return v}}return 0}function drawGame(){let g=S.game,e=$('#gamecontent');if(!e)return;if(g==='ttt'){let w=tttWin(S.ttt),done=!!w||S.ttt.every(Boolean);e.innerHTML=`<div class="status">${w?'Player '+w+' wins!':done?'Draw game':`Player ${S.turn}’s turn`}</div><div class="board">${S.ttt.map((v,i)=>`<button class="cell" data-ttt="${i}" ${v||done?'disabled':''}>${v}</button>`).join('')}</div><button class="btn secondary full" id="restart">Restart</button>`;$$('[data-ttt]').forEach(b=>b.onclick=()=>{if(S.ttt[+b.dataset.ttt]||tttWin(S.ttt))return;S.ttt[+b.dataset.ttt]=S.turn;S.turn=S.turn==='X'?'O':'X';drawGame()});$('#restart').onclick=()=>{S.ttt=Array(9).fill('');S.turn='X';drawGame()};return}if(g==='quiz'){if(S.quiz>=qs.length){e.innerHTML=`<div class="status"><h3>Quiz complete</h3><p>You scored ${S.score}/${qs.length}</p><button class="btn primary" id="restart">Play again</button></div>`;$('#restart').onclick=()=>{S.quiz=0;S.score=0;drawGame()};return}let q=qs[S.quiz];e.innerHTML=`<div class="status">Question ${S.quiz+1}/${qs.length} · Score ${S.score}</div><h3>${q.q}</h3>${q.a.map((a,i)=>`<button class="btn secondary full" style="margin:5px 0" data-answer="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}`;$$('[data-answer]').forEach(b=>b.onclick=()=>{if(+b.dataset.answer===q.c)S.score++;S.quiz++;drawGame()});return}if(g==='connect'){let w=cWin(S.connect),full=S.connect[0].every(Boolean);e.innerHTML=`<div class="status">${w?(w===1?'Red':'Yellow')+' wins!':full?'Draw':(S.cturn===1?'Red':'Yellow')+' turn'}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#174fc0;padding:7px;border-radius:10px;margin:15px auto;max-width:370px">${S.connect.flatMap((r,ri)=>r.map((v,c)=>`<button data-col="${c}" ${w||full?'disabled':''} style="aspect-ratio:1;border:0;border-radius:50%;background:${v===1?'#ff6d83':v===2?'#ffd15d':'#071735'}"></button>`)).join('')}</div><button class="btn secondary full" id="restart">Restart</button>`;$$('[data-col]').forEach(b=>b.onclick=()=>{let c=+b.dataset.col;for(let r=5;r>=0;r--)if(!S.connect[r][c]){S.connect[r][c]=S.cturn;S.cturn=S.cturn===1?2:1;drawGame();break}});$('#restart').onclick=()=>{S.connect=Array.from({length:6},()=>Array(7).fill(0));S.cturn=1;drawGame()};return}if(g==='rps'){e.innerHTML=`<p>Choose your move against the computer.</p><div class="row">${['Rock 🪨','Paper 📄','Scissors ✂️'].map((x,i)=>`<button class="btn secondary" data-rps="${i}">${x}</button>`).join('')}</div><p id="rpsresult"></p>`;$$('[data-rps]').forEach(b=>b.onclick=()=>{let a=+b.dataset.rps,c=Math.random()*3|0;$('#rpsresult').textContent=`You: ${['Rock','Paper','Scissors'][a]} · Computer: ${['Rock','Paper','Scissors'][c]} — ${a===c?'Draw':(a-c+3)%3===1?'You win!':'Computer wins!'}`});return}if(g==='guess'){e.innerHTML=`<p>Guess a number from 1 to 20.</p><form id="guessform" class="row"><input id="guessinput" type="number" min="1" max="20" required><button class="btn primary">Guess</button></form><p id="guessresult" class="muted"></p><button class="btn secondary" id="restart">New number</button>`;$('#guessform').onsubmit=e=>{e.preventDefault();S.tries++;let n=+$('#guessinput').value;$('#guessresult').textContent=n===S.guess?`Correct in ${S.tries} guesses!`:n<S.guess?'Too low — try again.':'Too high — try again.'};$('#restart').onclick=()=>{S.guess=1+Math.random()*20|0;S.tries=0;drawGame()};return}if(g==='word'){let scrambled=S.word.split('').sort(()=>Math.random()-.5).join('');e.innerHTML=`<p>Unscramble this word:</p><h2 style="letter-spacing:5px;text-align:center;color:#9bbaff">${scrambled}</h2><p class="muted">School and learning · ${S.wordtries} tries left</p><form id="wordform" class="row"><input id="wordinput" required maxlength="12" placeholder="Your answer"><button class="btn primary">Check</button></form><p id="wordresult"></p><button class="btn secondary" id="restart">New word</button>`;$('#wordform').onsubmit=e=>{e.preventDefault();let val=$('#wordinput').value.trim().toUpperCase();if(val===S.word){$('#wordresult').textContent='Correct! 🎉';S.wordtries=0}else{S.wordtries--;$('#wordresult').textContent=S.wordtries?`Not quite. ${S.wordtries} tries left.`:`The word was ${S.word}.`}if(!S.wordtries)$('#wordform').classList.add('hidden')};$('#restart').onclick=()=>{S.word=['PLANET','SCHOOL','FRIEND','PUZZLE','SCIENCE'][Math.random()*5|0];S.wordtries=5;drawGame()}}}
function viewProfile(){let p=S.profile;$('#main').innerHTML=`<div class="head"><div><h1 class="title">My profile</h1><span class="tiny">Manage your nickname and school</span></div></div><div class="card"><div class="row" style="margin-bottom:15px"><span class="avatar" style="width:54px;height:54px">${initials(p.nickname)}</span><div><h2 style="margin:0">${esc(p.nickname)}</h2><span class="tiny">Member since ${new Date(S.session.user.created_at).toLocaleDateString()}</span></div></div><form id="profileform"><div class="field"><label>Public nickname</label><input id="pnick" minlength="3" maxlength="24" required value="${esc(p.nickname)}"></div><div class="field"><label>School (optional)</label><input id="pschool" maxlength="90" value="${esc(p.school||'')}"></div><button class="btn primary">Save profile</button></form><hr style="border:0;border-top:1px solid #25416b;margin:20px 0"><h3>Safety</h3><p class="muted">Do not include full legal name, address, phone number, timetable, or private school records.</p><button class="btn danger" id="deleteinfo">Account deletion information</button></div>`;$('#profileform').onsubmit=async e=>{e.preventDefault();let nickname=$('#pnick').value.trim(),school=$('#pschool').value.trim();let {error}=await db.from('profiles').update({nickname,school,updated_at:new Date().toISOString()}).eq('id',S.session.user.id);if(error)toast(error.message);else{S.profile={...p,nickname,school};toast('Profile updated');renderView()}};$('#deleteinfo').onclick=()=>modal('Account deletion',`<p class="muted">Automated account deletion is not implemented in this starter. Set up a secure admin deletion process before launch. Never email anyone your password.</p><button class="btn secondary" onclick="document.querySelector('#modalbg').classList.remove('open')">Close</button>`)}
async function viewSchools(){let {data,error}=await db.from('profiles').select('school').not('school','is',null).neq('school','').limit(500);if(error)throw error;let c={};(data||[]).forEach(p=>{let s=p.school.trim();if(s)c[s]=(c[s]||0)+1});let rows=Object.entries(c).sort((a,b)=>b[1]-a[1]);$('#main').innerHTML=`<div class="head"><div><h1 class="title">School communities</h1><span class="tiny">Schools represented by members</span></div></div><div class="card"><p class="muted">School names are self-reported, not verified.</p>${rows.map(([s,n])=>`<div class="friendline"><span class="avatar">🏫</span><div class="details"><strong>${esc(s)}</strong><small>${n} member(s)</small></div></div>`).join('')||'<div class="empty">🏫<h3>No school communities yet</h3>Add a school in your profile (optional).</div>'}</div>`}async function viewPolls(){let {data,error}=await db.from('posts').select('id,user_id,body,created_at,poll_question,poll_options').eq('post_type','poll').order('created_at',{ascending:false}).limit(40);if(error)throw error;let ids=[...new Set((data||[]).map(p=>p.user_id))],{data:ps}=ids.length?await db.from('profiles').select('id,nickname').in('id',ids):{data:[]},pm=Object.fromEntries((ps||[]).map(p=>[p.id,p.nickname]));$('#main').innerHTML=`<div class="head"><div><h1 class="title">Polls & opinions</h1><span class="tiny">See what students think</span></div><button class="btn primary" id="newpoll">＋ Create poll</button></div>${(data||[]).map(p=>`<div class="card"><b>${esc(pm[p.user_id]||'Student')}</b><div class="meta">${ago(p.created_at)}</div><h3>${esc(p.poll_question||p.body)}</h3>${(p.poll_options||[]).map((o,i)=>`<button class="btn secondary full" style="margin:4px 0" data-vote="${p.id}" data-option="${i}">${esc(o)}</button>`).join('')}</div>`).join('')||'<div class="card empty">📊<h3>No polls yet</h3>Start a respectful discussion.</div>'}`;$('#newpoll').onclick=createPoll;$$('[data-vote]').forEach(b=>b.onclick=()=>vote(b.dataset.vote,+b.dataset.option))}async function reportPost(id){modal('Report content',`<p class="muted">Reports are stored for review; a moderator workflow still needs to be built.</p><form id="reportform"><div class="field"><label>Reason</label><select id="reason"><option>Bullying or harassment</option><option>Personal information</option><option>Hate or threats</option><option>Spam or scam</option><option>Other safety concern</option></select></div><div class="field"><label>Details (optional)</label><textarea id="details" maxlength="500"></textarea></div><button class="btn primary">Submit report</button></form>`);$('#reportform').onsubmit=async e=>{e.preventDefault();let {error}=await db.from('reports').insert({reporter_id:S.session.user.id,content_type:'post',content_id:id,reason:$('#reason').value,details:$('#details').value});if(error)toast(error.message);else{closeModal();toast('Report submitted')}}}
function wireActions(){$$('[data-messagefriend]').forEach(b=>b.onclick=()=>startConversation(b.dataset.messagefriend));$$('[data-add]').forEach(b=>b.onclick=()=>addFriend(b.dataset.add));$$('[data-accept]').forEach(b=>b.onclick=()=>accept(b.dataset.accept));$$('[data-report]').forEach(b=>b.onclick=()=>reportPost(b.dataset.report))}function setView(v){S.view=v;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));renderView()}async function searchPeople(q){setView('friends');setTimeout(()=>{let i=$('#peoplefilter');if(i){i.value=q;i.dispatchEvent(new Event('input'))}},100)}function setupRealtime(){db.channel('feed-updates').on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},()=>{if(S.view==='feed')viewFeed()}).subscribe()}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){e.preventDefault();setView(v.dataset.view);return}let mf=e.target.closest('[data-messagefriend]');if(mf){startConversation(mf.dataset.messagefriend);return}let a=e.target.closest('[data-add]');if(a){addFriend(a.dataset.add);return}let ac=e.target.closest('[data-accept]');if(ac){accept(ac.dataset.accept);return}let r=e.target.closest('[data-report]');if(r){reportPost(r.dataset.report);return}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(async()=>{if(!configured){renderAuth('signup','Setup needed: create Supabase project, run supabase_schema.sql, and replace the two placeholders in index.html.');return}await boot()})();
