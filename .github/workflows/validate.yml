name: StudentLink validation

on:
  push:
    branches: [main, 'studentlink/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Run static project checks
        run: node scripts/check-project.mjs
